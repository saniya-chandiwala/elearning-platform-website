<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/page.css">
    <link rel="stylesheet" href="../CSS/checkout.css">
    <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body>
    <header id="headerPlaceholder"></header>
    <main class="checkout-page">
        <header class="checkout-header">
            <h1>Complete Your Order</h1>
            <p>Review your courses and choose how you would like to pay.</p>
        </header>
        <p class="page-message" id="checkoutMessage" role="status"></p>
        <div class="checkout-layout">
            <section class="checkout-card order-review">
                <h2>Order summary</h2>
                <div id="checkoutItems"></div>
                <div class="checkout-total"><strong>Total</strong><strong id="checkoutTotal">₹ 0.00</strong></div>
            </section>
            <form id="checkoutForm" class="checkout-card payment-form">
                <h2>Payment method</h2>
                <div class="payment-options">
                    <label class="payment-option">
                        <input type="radio" name="paymentMode" value="1" checked>
                        <span>Debit card</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="paymentMode" value="2">
                        <span>Credit card</span>
                    </label>
                </div>
                <div id="cardDetails" class="card-details-form">
                    <label for="cardName">Name on card</label>
                    <input type="text" id="cardName" autocomplete="cc-name" required>
                    <label for="cardNumber">Card number</label>
                    <input type="text" id="cardNumber" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="23" pattern="[0-9 ]{12,23}" required>
                    <div class="card-fields-row">
                        <div>
                            <label for="cardExpiry">Expiry date</label>
                            <input type="text" id="cardExpiry" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5" pattern="(0[1-9]|1[0-2])/[0-9]{2}" required>
                        </div>
                        <div>
                            <label for="cardCvv">CVV</label>
                            <input type="password" id="cardCvv" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" pattern="[0-9]{3,4}" required>
                        </div>
                    </div>
                </div>
                <button class="btn-primary" id="payButton" type="submit">Pay ₹ 0.00</button>
            </form>
        </div>
    </main>
    <footer id="footerPlaceholder"></footer>
    <script src="../jquery-3.6.0.js"></script>
    <script src="../SCRIPTS/session.js"></script>
    <script src="../SCRIPTS/fetchNavAndFooter.js"></script>
    <script src="../SCRIPTS/checkout.js"></script>
</body>
</html>
