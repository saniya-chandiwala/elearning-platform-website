<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/page.css">
    <link rel="stylesheet" href="../CSS/cart.css">
    <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body>
    <header id="headerPlaceholder"></header>
    <main class="cart-page">
        <header id="cartHeader"><h1>Shopping Bag</h1></header>
        <p class="page-message" id="cartMessage" role="status"></p>
        <div id="cartLayout">
            <section id="cartItemsContainer"></section>
            <aside id="cartSummary">
                <h2>Order Summary</h2>
                <div class="summary-line"><span>Courses</span><span id="summaryCount">0</span></div>
                <div class="summary-line"><span>Subtotal</span><span id="summarySubtotal">₹ 0.00</span></div>
                <div class="summary-line"><span>Fees</span><span>Free</span></div>
                <div class="summary-line total-line"><span>Estimated Total</span><span id="summaryTotal">₹ 0.00</span></div>
                <a id="checkoutButton" href="checkout.html">Proceed to Checkout</a>
            </aside>
        </div>
        <section id="emptyCart" hidden>
            <p>Your shopping bag is currently empty.</p>
            <a href="courses.html?categoryID=0">Continue Shopping &rarr;</a>
        </section>
    </main>
    <footer id="footerPlaceholder"></footer>
    <script src="../jquery-3.6.0.js"></script>
    <script src="../SCRIPTS/session.js"></script>
    <script src="../SCRIPTS/fetchNavAndFooter.js"></script>
    <script src="../SCRIPTS/cart.js"></script>
</body>
</html>
