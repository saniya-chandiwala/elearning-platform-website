<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body class="auth-body">

    <!-- Injected Navigation -->
    <header id="headerPlaceholder"></header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create an Account</h2>
                <p>Join Academy today to unlock full curriculums and labs.</p>
            </div>

            <!-- Error Banner -->
            <div id="registerError" class="auth-alert error-alert" hidden></div>
            <!-- Success Banner -->
            <div id="registerSuccess" class="auth-alert success-alert" hidden></div>

            <form id="registerForm" class="auth-form" novalidate>
                <!-- Hardcoded Role (Default: Student Learner, TypeID = 3) -->
                <input type="hidden" id="registerRole" value="3">

                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="registerName" placeholder="John Doe" required autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="registerEmail" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="registerPassword" placeholder="Enter a password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" id="toggleRegisterPassword" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerConfirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="password" id="registerConfirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" id="toggleRegisterConfirmPassword" aria-label="Toggle confirm password visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit" id="registerSubmitBtn">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </main>

    <!-- Injected Footer -->
    <footer id="footerPlaceholder"></footer>

    <script src="../jquery-3.6.0.js"></script>
    <script src="../SCRIPTS/session.js"></script>
    <script src="../SCRIPTS/fetchNavAndFooter.js"></script>
    <script src="../SCRIPTS/auth.js"></script>
</body>
</html>
