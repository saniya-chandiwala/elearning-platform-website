<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/page.css">
    <link rel="stylesheet" href="../CSS/admin.css">
    <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body>
    <header id="headerPlaceholder"></header>
    <main class="admin-page">
        <h1>Admin dashboard</h1>
        <p>Filter users by role, search for an account, then select it to review its details.</p>
        <p class="page-message" id="adminMessage" role="status"></p>
        <section class="admin-panel">
            <div class="admin-filter-row">
                <div class="form-group">
                    <label for="selectUserRole">User type</label>
                    <select id="selectUserRole">
                        <option value="" disabled selected hidden>Select a user type</option>
                        <option value="All">All users</option>
                        <option value="1">Admin</option>
                        <option value="2">Instructor</option>
                        <option value="3">Student</option>
                    </select>
                </div>
                <div class="form-group user-search">
                    <label for="userSearchInput">Find user</label>
                    <input type="search" id="userSearchInput" placeholder="Select a user type first..." disabled autocomplete="off">
                    <div id="userDropdown" class="search-dropdown" hidden></div>
                </div>
            </div>
            <section class="selected-user-panel">
                <h2>Selected user</h2>
                <div id="selectedUserDetails" class="details-placeholder">Choose a user from the search results.</div>
                <button type="button" class="btn-danger" id="deleteUserButton" disabled>Delete user</button>
            </section>
        </section>
    </main>
    <footer id="footerPlaceholder"></footer>
    <script src="../jquery-3.6.0.js"></script>
    <script src="../SCRIPTS/session.js"></script>
    <script src="../SCRIPTS/fetchNavAndFooter.js"></script>
    <script src="../SCRIPTS/admin.js"></script>
</body>
</html>
