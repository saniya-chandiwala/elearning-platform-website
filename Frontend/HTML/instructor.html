<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Studio — Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/page.css">
    <link rel="stylesheet" href="../CSS/instructor.css">
    <link rel="stylesheet" href="../CSS/theme.css">
</head>

<body>
    <header id="headerPlaceholder"></header>
    <main class="instructor-page">
        <h1>Instructor studio</h1>
        <p>Choose a category and course to manage its details, or create a new course.</p>
        <p class="page-message" id="instructorMessage" role="status"></p>
        <section class="instructor-panel">
            <div class="instructor-filter-row">
                <div class="form-group">
                    <label for="selectCategory">Course category</label>
                    <select id="selectCategory">
                        <option value="" disabled selected hidden>Select a category</option>
                    </select>
                </div>
                <div class="form-group course-search">
                    <label for="courseSearch">Find course</label>
                    <input type="search" id="courseSearch" placeholder="Select a category first..." disabled
                        autocomplete="off">
                    <div id="courseDropdown" class="search-dropdown" hidden></div>
                </div>
                <button type="button" class="btn-primary" id="addNewCourse">Add new course</button>
            </div>
            <section class="course-editor">
                <h2>Course details</h2>
                <form id="courseForm" class="stacked-form">
                    <input type="hidden" id="courseID">
                    <input type="hidden" id="courseInstructorID">
                    <label for="courseName">Course name</label>
                    <input type="text" id="courseName" maxlength="150" disabled required>
                    <label for="courseCategory">Category</label>
                    <select id="courseCategory" disabled required></select>
                    <label for="coursePrice">Price (₹)</label>
                    <input type="number" id="coursePrice" min="0" max="99999999.99" step="0.01" disabled required>
                    <label for="courseImage">Image path or URL (optional)</label>
                    <input type="text" id="courseImage" maxlength="255" disabled
                        placeholder="../images/your-image.avif">
                    <label for="courseDescription">Description</label>
                    <textarea id="courseDescription" maxlength="500" rows="4" disabled></textarea>
                    <div class="button-row">
                        <button class="btn-primary" id="saveCourseButton" type="submit" disabled>Create course</button>
                        <button class="btn-secondary" id="deleteCourseButton" type="button" disabled>Delete
                            course</button>
                        <button class="btn-secondary" id="resetCourseForm" type="button">Clear form</button>
                    </div>
                </form>
            </section>
        </section>
    </main>
    <footer id="footerPlaceholder"></footer>
    <script src="../jquery-3.6.0.js"></script>
    <script src="../SCRIPTS/session.js"></script>
    <script src="../SCRIPTS/fetchNavAndFooter.js"></script>
    <script src="../SCRIPTS/instructor.js"></script>
</body>

</html>
