<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body class="auth-body">

    <!-- Injected Navigation -->
    <header id="headerPlaceholder"></header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to access your learning courses and track progress.</p>
            </div>

            <!-- Error Banner -->
            <div id="loginError" class="auth-alert error-alert" hidden></div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="toggleLoginPassword" aria-label="Toggle password visibility">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit" id="loginSubmitBtn">
                    <span>Sign In</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create one</a></p>
            </div>
        </div>
    </main>

    <!-- Injected Footer -->
    <footer id="footerPlaceholder"></footer>

    <script src="../jquery-3.6.0.js"></script>
    <script src="../SCRIPTS/session.js"></script>
    <script src="../SCRIPTS/fetchNavAndFooter.js"></script>
    <script src="../SCRIPTS/auth.js"></script>
</body>
</html>
